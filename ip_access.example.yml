# IP访问控制配置文件
# 释义:
# - blacklist: 黑名单列表，被列入的IP将被拒绝连接
# - whitelist: 白名单列表，只有在白名单模式(whitelist_mode: true)下才会生效
# - whitelist_mode: 白名单模式，false=黑名单模式(默认拒绝黑名单), true=白名单模式(仅允许白名单)
#
# 条目支持以下写法(匹配不区分大小写):
# - 精确匹配: 192.168.1.100
# - 通配符: * 匹配任意长度, ? 匹配单个字符, 如 192.168.1.? / 2001:db8::*
# - 字符类: [abc] 匹配其中之一, [a-f] 匹配范围, [!a-f] 或 [^a-f] 取反
# - CIDR: 10.0.0.0/8 或 2001:db8::/32
#
# 示例配置:

# blacklist:
#   - "192.168.1.100"
#   - "10.0.0.0/8"
#   - "203.0.113.*"
#   - "192.168.2.?"
#
# whitelist:
#   - "127.0.0.1"
#   - "::1"
#
# whitelist_mode: false
